<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marleen's Cake Pops</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <style>
        /* --- CSS STYLES START HERE --- */
        
        /* Easter Palette */
        :root {
            --primary-color: #E6DAFA; /* Soft Pastel Purple */
            --dark-color: #9C77D9;    /* Deeper Easter Purple */
            --chocolate: #5D4037;     /* Dark Brown text */
            --white: #ffffff;
            --bg-light: #FFFFF8;      /* Very soft pastel yellow background */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--chocolate);
            background-color: var(--bg-light);
            line-height: 1.6;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
        }

        img {
            max-width: 100%;
            display: block;
            border-radius: 8px;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background-color: var(--white);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark-color);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .nav-links li a:hover {
            color: var(--dark-color);
        }

        /* Hero / Header Section */
        .hero {
            height: 80vh;
            /* Using the new Easter Egg image as the background! */
            background: linear-gradient(rgba(255,255,255,0.85), rgba(255,255,255,0.7)), url('easter_egg.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            color: var(--dark-color);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        /* Main Button Styling */
        .btn-main {
            display: inline-block;
            padding: 12px 30px;
            background-color: var(--dark-color); 
            color: var(--white);
            border-radius: 30px;
            font-weight: 600;
            transition: 0.3s ease-in-out; 
            box-shadow: 0 4px 6px rgba(156, 119, 217, 0.3); 
        }

        .btn-main:hover {
            background-color: #8A5DC2; 
            transform: translateY(-3px); 
            box-shadow: 0 6px 10px rgba(138, 93, 194, 0.4); 
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 80px 20px;
            text-align: center;
        }

        h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: var(--dark-color);
        }

        /* Menu Section */
        .bg-theme {
            background-color: #F8F4FF; /* Faint purple */
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
            justify-content: center;
        }

        .card {
            background: var(--white);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            text-align: left;
            transition: transform 0.3s;
            max-width: 400px;
            margin: 0 auto;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-image img {
            width: 100%;
            height: 350px; /* Gives the tall bunny/egg boxes room to breathe */
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .card h3 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: var(--chocolate);
        }

        .card p, 
        .card ul.details li {
            font-size: 0.95rem;       
            color: #666;              
            line-height: 1.6;         
            margin-top: 10px;         
        }

        .card ul.details {
            list-style-position: inside;
            padding-left: 0;
            margin-top: 10px;
        }

        /* Contact Section */
        #contact {
            background-color: var(--white); 
            color: var(--chocolate);        
            padding: 80px 20px;
            text-align: center;
            border-top: 4px solid #F8F4FF;  
        }

        #contact h2 {
            color: var(--dark-color);        
            margin-bottom: 15px;
        }

        footer {
            background-color: #3E2b24;
            color: #aaa;
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .nav-links { display: none; } 
            .logo { margin: 0 auto; }
            .hero { height: 60vh; }
        }
    </style>
</head>
<body>

    <header class="hero">
        <div class="hero-content">
            <h1>Marleen's Cake Pops</h1>
        </div>
    </header>

    <section id="menu" class="bg-theme">
        <div class="container">
            <h2>Easter Collection</h2>
            <div class="menu-grid">
                
                <div class="card">
                    <div class="card-image">
                        <img src="easter_bunny.png" alt="Yellow Bunny Box">
                    </div>
                    <h3>$12 Option</h3>
                    <p>Cake Pop Flavors:</p>
                    <ul class="details">
                        <li>Egg Nests are Vanilla</li>
                    </ul>
                </div>
                
                <div class="card">
                    <div class="card-image">
                        <img src="easter_egg.png" alt="Easter Egg Tray">
                    </div>
                    <h3>$20 Option</h3>
                    <p>Cake Pop Flavors:</p>
                    <ul class="details">
                        <li>Carrot is Chocolate</li>
                        <li>Egg Nests are Vanilla</li>                    
                    </ul>
                </div>


            </div>
        </div>
    </section>

    <section id="contact">
        <div class="contact-box">
            <a href="https://www.instagram.com/popsbymars?igsh=NTc4MTIwNjQ2YQ%3D%3D&utm_source=qr" class="btn-main" target="_blank">Instagram: @popsbymars</a>
        </div>
    </section>


</body>
</html>
